# ChessYar Professional - نکات مجوز و منابع

## مهره‌های شطرنج (cburnett)

- نویسنده: Colin M.L. Burnett (نام کاربری: Cburnett)
- منبع: ویکی‌مدیا کامنز - همان مجموعه‌ای که وب‌سایت لیشس (lichess.org) به‌صورت پیش‌فرض استفاده می‌کند
- فایل‌های این پروژه از مخزن رسمی لیشس (`lichess-org/lila`, مسیر `public/piece/cburnett`) دریافت شده‌اند
- مجوز (مطابق صفحه فایل‌ها در ویکی‌مدیا کامنز): **GFDL 1.2+ / CC BY-SA 3.0 / BSD / GPL 2+**
- نام و منبع نویسنده در صفحه «تنظیمات → درباره» برنامه نیز ذکر شده است

## فونت فارسی

- **Vazirmatn** - مجوز SIL Open Font License 1.1 - منبع: github.com/rastikerdar/vazirmatn

## پکیج‌های Dart

- **dartchess** - موتور قوانین شطرنج استفاده‌شده توسط پروژه‌های لیشس - مجوز MIT - pub.dev/packages/dartchess
- **flutter_svg** - مجوز MIT
- **audioplayers** - پخش صدا - مجوز MIT
- **shared_preferences** - مجوز BSD-3
- مجوز کامل همه پکیج‌ها داخل برنامه: «تنظیمات → مجوزهای نرم‌افزاری»

## صداها

- فایل‌های `assets/sounds/*.wav` (حرکت، گرفتن، کیش، قلعه، ارتقا، پایان بازی) **به‌صورت محلی و برنامه‌نویسی‌شده تولید شده‌اند** و کپی‌ی از هیچ منبع بیرونی نیستند؛ سبک آن‌ها شبیه بازیِ صوتی لیچس ساخته شده است.
- اگر بعداً بخواهید نمونه‌های واقعی لیچس جایگزین شوند، مجوز هر فایل باید قبل از بسته‌بندی بررسی شود.

## موتورهای شطرنج (در بیلد GitHub Actions دانلود و در کنار برنامه نصب می‌شوند)

- **Stockfish** - مخزن: github.com/official-stockfish/Stockfish - مجوز: GPLv3 (متن رسمی در مخزن پروژه)
- **Berserk** - مخزن: github.com/jhonnold/berserk - مجوز: GPLv3 (متن رسمی در مخزن پروژه)
- **Viridithas** - مخزن: github.com/cosmobobak/viridithas - مجوز: متن رسمی در مخزن پروژه

این موتورها به‌عنوان برنامه‌های جداگانه اجرا می‌شوند و بخشی از کد ChessYar نیستند؛
مجوز رسمی هر یک را در مخزن مربوطه ببینید.

