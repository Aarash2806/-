# chessyar

A new Flutter project.

## Getting Started

This project is a starting point for a Flutter application.

A few resources to get you started if this is your first Flutter project:

- [Learn Flutter](https://docs.flutter.dev/get-started/learn-flutter)
- [Write your first Flutter app](https://docs.flutter.dev/get-started/codelab)
- [Flutter learning resources](https://docs.flutter.dev/reference/learning-resources)

For help getting started with Flutter development, view the
[online documentation](https://docs.flutter.dev/), which offers tutorials,
samples, guidance on mobile development, and a full API reference.

# ChessYar Professional — شطر یار حرفه‌ای

برنامه تحلیل شطرنج با Flutter برای ویندوز ۱۰/۱۱ — رابط فارسی راست‌به‌چپ، تم تیره‌ی حرفه‌ای (سرمه‌ای/طلایی)، مهره‌های دقیقاً لیچسی (مجموعه cburnett).

این مخزن روی **GitHub Actions** بیلد می‌شود؛ یعنی **نیازی به نصب Flutter یا هر ابزار دیگری روی سیستم شما نیست.** هر بار که کد را push کنید، فایل نصبی `ChessYar-Setup.exe` به‌صورت خودکار ساخته می‌شود.

## وضعیت فعلی (نسخه 0.2.1)

| بخش | وضعیت |
|---|---|
| تحلیل بازی (تخته لیچسی + قوانین کامل dartchess + FEN/PGN) | فعال |
| **موتورهای UCI واقعی** (Stockfish/Berserk/Viridithas) | **فعال** — پنل موتور با انتخاب موتور، عمق ۶ تا ۲۴، خطوط هم‌زمان ۱ تا ۳، نوار ارزیابی، خطوط PV با نماد شطرنجی (SAN)، آمار عمق/گره/سرعت؛ تحلیل به حرکت جدید «می‌چسبد» و خودکار به‌روز می‌شود |
| **درون‌ریزی PGN همه‌کاره** (جدید ۰.۲.۱) | **فعال** — دکمه‌های «باز کردن PGN…» و «درج PGN…» در صفحه تحلیل: هر نوع فایل PGN خوانده می‌شود — تک‌بازی، مجموعه چندبازی‌ای، کتاب‌های تمرین با FEN، کامنت {…} و ;، واریاسیون تو در تو، NAG، شماره‌های چسبیده، متن اضافه بین بازی‌ها، کدگذاری UTF-8/UTF-16/CP1252 و CRLF. حرکت‌های خراب فایل نادیده گرفته می‌شوند و برنامه روی بقیه بازی‌ها سالم کار می‌کند |
| **موتور سفارشی** (هر موتور UCI دیگر) | فعال — تنظیمات → افزودن موتور سفارشی (نام + مسیر exe + آرگومان‌ها) با آزمایش واقعی اتصال UCI |
| **صداها** (شبیه لیچس: حرکت، گرفتن، کیش، قلعه، ارتقا، پایان بازی) | فعال — مجموعه سنتزشده محلی با کنترل بلندی صدا |
| تنظیمات (۶ تم تخته + صدا + موتورها + درباره) | فعال |
| بازی‌های من، تمرین تاکتیک، کاوشگر گشایش، بانک اطلاعاتی، آمار عملکرد | به‌زودی (طبق نقشه راه ۹ مرحله‌ای) |
| کیفیت | `flutter analyze` بدون خطا + تست‌های خودکار (منطق بازی، پارسر PGN با ~۴۰ سناریو، پارسر UCI، دودِ رندر) در هر بیلد CI اجرا می‌شوند |

## چطور Setup.exe را بگیرم؟ (بدون نصب هیچ ابزاری)

### ۱) ساخت مخزن در گیت‌هاب
1. در github.com ثبت‌نام/ورود کنید.
2. دکمه سبز **New repository** → نام: `chessyar` → انتخاب **Public** یا **Private** (هر دو بیلد رایگان دارند) → **Create repository**.

### ۲) آپلود فایل‌ها
1. محتوای فایل `chessyar-github-upload.zip` را استخراج کنید.
2. در صفحه مخزن جدید، روی لینک **uploading an existing file** کلیک کنید.
3. وارد پوشه استخراج‌شده شوید، **همه‌ی فایل‌ها و پوشه‌ها را انتخاب کنید (Ctrl+A)** و آن‌ها را به صفحه آپلود بکشید.
   - مهم: خودِ پوشه را نکشید؛ محتویات داخلش را. پوشه‌ی مخفی `.github` باید حتماً آپلود شود.
4. پایین صفحه روی **Commit changes** بزنید و چند ثانیه صبر کنید.

### ۳) بیلد خودکار
1. تب **Actions** را باز کنید — بیلد «Build Windows Installer» به‌صورت خودکار شروع می‌شود.
2. حدود ۱۵ تا ۲۵ دقیقه طول می‌کشد (بیلدهای بعدی با کش سریع‌تر هستند).
3. بعد از تیک سبز، روی همان بیلد کلیک کنید و در پایین صفحه بخش **Artifacts** فایل **ChessYar-Setup** را دانلود کنید.

### ۴) نصب
1. فایل دانلودی یک zip است؛ داخل آن `ChessYar-Setup.exe` قرار دارد.
2. آن را اجرا کنید → Next → Install → Finish.
3. آیکون **ChessYar Professional** روی دسکتاپ و در منوی Start ظاهر می‌شود.

### نسخه رسمی (Release)
اگر در gith‌هاب یک تگ با الگوی `v1.0.0` بسازید (Releases → Draft a new release → Choose a tag)، همان بیلد به‌صورت خودکار یک Release با فایل Setup می‌سازد که لینک دانلود همیشگی دارد.

## اجرای بیلد دستی
تب Actions → «Build Windows Installer» → **Run workflow**.

## نکات فنی

- **بیلد:** Flutter 3.50.0 stable روی `windows-latest`؛ تست‌ها و analyze در هر بیلد اجرا می‌شوند و در صورت خطا بیلد fail می‌شود.
- **موتورها:** اسکریپت `scripts/fetch_engines.ps1` آخرین نسخه رسمی سه موتور را دانلود و کنار exe نصب می‌کند. اگر دانلود یکی ناموفق باشد، بیلد نمی‌شکند؛ فقط آن موتور در برنامه فهرست نمی‌شود.
- **قوانین شطرنج:** کتابخانه dartchess (همان که لیشس استفاده می‌کند) — شامل قلعه، آن‌پاسان، ارتقا، کیش/مات/پات.
- **پارسر PGN:** `lib/services/pgn/` — نرمال‌ساز متن + تشخیص کدگذاری + اعتبارسنجی هر حرکت با موتور dartchess؛ فایل‌های خراب هرگز برنامه را متوقف نمی‌کنند (فقط هشدار و شمارش حرکت‌های رد‌شده).
- **مهره‌ها:** مجموعه cburnett اثر Colin M.L. Burnett (همان مهره‌های پیش‌فرض لیشس) — مجوزها در `ATTRIBUTION.md`.
- **فونت:** Vazirmatn (OFL).
- **صداهای لیچسی:** مجموعه سنتزشده‌ی محلی (WAV داخل برنامه) — بدون کپی از سایت لیچس، با کیفیت مشابه و قابل تعویض در بیلدهای بعد.
- **بعدی:** بخش «بازی‌های من» (واردات PGN + بانک اطلاعاتی SQLite)، سپس تمرین تاکتیک و بقیه‌ی نقشه راه.

## ساختار پروژه

```
.github/workflows/build-windows.yml   گردش‌کار بیلد و ساخت Setup
packaging/chessyar.iss                اسکریپت Inno Setup (آیکون دسکتاپ + منوی Start)
scripts/fetch_engines.ps1             دانلود موتورهای UCI
lib/services/uci_engine.dart          کلاینت واقعی پروتکل UCI (پروسه‌ی جدا + MultiPV)
lib/services/pgn/                     پارسر همه‌کاره PGN (مجموعه/تمرین/کامنت/واریاسیون/کدگذاری)
lib/services/engine_manager.dart      شناسایی موتورهای داخلی + موتورهای سفارشی کاربر
lib/services/sound_service.dart       پخش مجموعه صدای شبیه لیچس
lib/                                  کد Dart (پوسته RTL، تخته لیچسی، تحلیل، تنظیمات)
assets/pieces/cburnett/               ۱۲ فایل SVG مهره‌ها
